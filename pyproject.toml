[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-rebalance-research"
version = "0.1.0"
description = "Go2 walking and motor-fault research in MuJoCo"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

